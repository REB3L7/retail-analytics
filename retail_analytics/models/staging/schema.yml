version: 2

models:
  - name: stg_customers
    description: "Clean customer data from the raw customer dataset."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: email
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Clean product catalog data."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

      - name: category
        tests:
          - not_null

      - name: price
        tests:
          - not_null

  - name: stg_stores
    description: "Clean physical store data."
    columns:
      - name: store_id
        tests:
          - not_null
          - unique

  - name: stg_orders
    description: "Retail orders across store and online sales channels."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: sales_channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['STORE', 'ONLINE']

  - name: stg_order_items
    description: "Individual products purchased within each order."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]